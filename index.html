<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Domino Gaple Multi-Device</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Titan+One&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body { font-family: 'Fredoka', sans-serif; background: #061e12; overflow: hidden; }
    .font-titan { font-family: 'Titan One', cursive; }

    /* Ukuran Adaptif Menggunakan Responsive Units (vw/vh) */
    .domino-card {
      width: clamp(32px, 8vw, 46px);
      height: clamp(58px, 14vw, 82px);
      background: #fdfbf7; border: 2px solid #1a1a1a;
      border-radius: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.4); display: flex;
      flex-direction: column; justify-content: space-between; align-items: center;
      padding: 2px; cursor: pointer; transition: transform 0.15s; flex-shrink: 0;
    }
    .domino-card:active, .domino-card:hover { transform: translateY(-4px); }
    
    .domino-card.horizontal {
      width: clamp(58px, 14vw, 82px);
      height: clamp(32px, 8vw, 46px);
      flex-direction: row;
    }

    .domino-divider-v { width: 100%; height: 2px; background: #333; margin: 1px 0; }
    .domino-divider-h { height: 100%; width: 2px; background: #333; margin: 0 1px; }

    .dot-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 100%; height: 100%; place-items: center; }
    .dot { width: clamp(4px, 1vw, 6px); height: clamp(4px, 1vw, 6px); background-color: #111; border-radius: 50%; }

    .glass-panel { background: rgba(15, 45, 28, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15); }
    
    /* Scrollbar halus */
    ::-webkit-scrollbar { height: 4px; width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
  </style>
</head>
<body class="h-screen w-screen text-white flex flex-col justify-between">

  <!-- LOBBY MAIN MENU -->
  <div id="lobby" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gradient-to-br from-emerald-950 via-green-950 to-black">
    <div class="glass-panel rounded-3xl p-5 sm:p-7 w-full max-w-xs sm:max-w-sm text-center shadow-2xl border border-emerald-500/30">
      <div class="font-titan text-2xl sm:text-3xl text-amber-400 mb-1">🀏 GAPLE MULTI</div>
      <p class="text-xs text-emerald-200/80 mb-4 sm:mb-6">Main di HP, Tablet, atau Laptop!</p>

      <input type="text" id="player-name" placeholder="Nama Anda" class="w-full py-2.5 sm:py-3 px-4 rounded-xl bg-slate-900/90 border border-emerald-500/50 text-white font-bold text-center text-sm mb-3 outline-none focus:border-amber-400">
      <input type="number" id="room-code" placeholder="Kode Room (cth: 888)" class="w-full py-2.5 sm:py-3 px-4 rounded-xl bg-slate-900/90 border border-emerald-500/50 text-white font-bold text-center text-sm mb-4 outline-none focus:border-amber-400">

      <button onclick="masukRoom()" class="w-full py-3 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 font-titan text-base sm:text-lg text-slate-950 shadow-lg hover:brightness-110 active:scale-95 transition-all mb-3">
        MASUK LOBBY 🚀
      </button>

      <!-- TOMBOL FULLSCREEN -->
      <button onclick="toggleFullscreen()" class="w-full py-2.5 rounded-2xl bg-slate-800/90 border border-slate-600/50 font-titan text-xs sm:text-sm text-slate-100 shadow-lg hover:bg-slate-700 active:scale-95 transition-all flex items-center justify-center gap-2 mb-3">
        🖥️ Fullscreen
      </button>

      <!-- TOMBOL SPECIAL RESET ROOM -->
      <button onclick="specialResetRoom()" class="w-full py-2.5 rounded-2xl bg-gradient-to-r from-red-800 to-red-900 border border-red-500/40 font-titan text-xs sm:text-sm text-red-200 shadow-lg hover:brightness-120 active:scale-95 transition-all flex items-center justify-center gap-2">
        💥 Special Reset Room
      </button>
    </div>
  </div>

  <!-- GAME ARENA -->
  <div id="arena" class="hidden flex-col h-full w-full bg-emerald-900 justify-between p-2 sm:p-4 relative">
    
    <!-- Top Bar -->
    <div class="glass-panel rounded-xl p-2 sm:p-3 flex justify-between items-center text-xs sm:text-sm font-bold">
      <div>Room: <span id="disp-room" class="text-amber-400">-</span></div>
      <div id="disp-turn" class="text-amber-300 font-titan animate-pulse text-xs sm:text-base">Menunggu...</div>
      <button onclick="keluarRoom()" class="bg-red-600 hover:bg-red-500 px-2.5 py-1 rounded-lg text-white text-xs">Keluar</button>
    </div>

    <!-- Panel Waiting/Lobby Game -->
    <div id="lobby-waiting" class="glass-panel rounded-xl p-3 text-center my-1 sm:my-2">
      <div class="text-xs text-emerald-200 mb-1 sm:mb-2">Pemain Terhubung (<span id="player-count">1</span>/4):</div>
      <div id="player-list" class="flex flex-wrap justify-center gap-1.5 text-xs font-bold mb-2 sm:mb-3"></div>
      <button id="btn-start" onclick="mulaiGameDenganBot()" class="bg-gradient-to-r from-emerald-500 to-green-600 font-titan px-4 py-2 rounded-xl text-xs text-white shadow-lg hover:brightness-110">
        ▶️ MULAI GAME (Sisa Slot Diisi Bot)
      </button>
    </div>

    <!-- Board Arena (Rantai Domino) -->
    <div id="board" class="flex-1 my-2 glass-panel rounded-2xl p-2 sm:p-4 flex items-center justify-start overflow-x-auto gap-1 border border-emerald-600/40 shadow-inner min-h-[100px]">
      <div id="empty-board-msg" class="w-full text-center text-emerald-300/50 text-xs sm:text-sm italic">Tekan "Mulai Game" untuk melempar kartu.</div>
    </div>

    <!-- Hands (Kartu Player) & Controls -->
    <div class="glass-panel rounded-2xl p-2 sm:p-3 flex flex-col gap-1.5">
      <div class="flex justify-between items-center text-xs px-1">
        <span class="font-bold text-emerald-200">Kartu Anda (<span id="card-count">0</span>):</span>
        <button id="btn-pass" onclick="passTurn()" class="hidden bg-amber-500 hover:bg-amber-400 text-slate-950 font-titan px-3 py-1 rounded-lg text-xs shadow-md">
          LEWAT (PASS) ⏭️
        </button>
      </div>

      <div id="hand" class="flex gap-1.5 sm:gap-2 overflow-x-auto py-1.5 px-0.5 items-center min-h-[65px] sm:min-h-[90px]"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB6qWcP-732y2gdeUpVAuc50wEzRUYvZog",
      authDomain: "tarik-tambang-all-in.firebaseapp.com",
      databaseURL: "https://tarik-tambang-all-in-default-rtdb.firebaseio.com",
      projectId: "tarik-tambang-all-in",
      storageBucket: "tarik-tambang-all-in.firebasestorage.app",
      messagingSenderId: "926072529297",
      appId: "1:926072529297:web:b5b867cbb7072c91723a30"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName = "", roomID = "", myID = "", roomRef = null, gameState = {};

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch((err) => {
          alert(`Gagal mengaktifkan mode Fullscreen: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    function generateDeck() {
      let deck = [];
      for (let i = 0; i <= 6; i++) {
        for (let j = i; j <= 6; j++) deck.push([i, j]);
      }
      return deck.sort(() => Math.random() - 0.5);
    }

    function masukRoom() {
      myName = document.getElementById('player-name').value.trim() || "Pemain";
      const code = document.getElementById('room-code').value.trim();
      if (!code) { alert("Masukkan kode room!"); return; }

      roomID = "domino_" + code;
      myID = "p_" + Math.random().toString(36).substr(2, 5);
      roomRef = db.ref('rooms/' + roomID);

      roomRef.get().then((snapshot) => {
        let data = snapshot.val();
        if (!data) {
          data = {
            players: { [myID]: { name: myName, hand: [], isBot: false } },
            playerOrder: [myID],
            currentTurnIdx: 0, board: [], leftVal: -1, rightVal: -1, status: "waiting", host: myID
          };
          roomRef.set(data);
        } else {
          if (Object.keys(data.players || {}).length >= 4 && !data.players[myID]) {
            alert("Room sudah penuh (Maksimal 4 Pemain)!");
            return;
          }
          if (!data.players[myID] && data.status === "waiting") {
            data.players[myID] = { name: myName, hand: [], isBot: false };
            data.playerOrder.push(myID);
            roomRef.update(data);
          }
        }

        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('arena').classList.remove('hidden');
        document.getElementById('arena').classList.add('flex');
        document.getElementById('disp-room').innerText = code;

        dengarkanServer();
      });
    }

    function specialResetRoom() {
      const code = document.getElementById('room-code').value.trim();
      if (!code) { alert("Masukkan Kode Room yang ingin di-reset!"); return; }

      if (confirm(`Hapus & Reset Room [${code}]?`)) {
        db.ref('rooms/domino_' + code).remove().then(() => {
          alert(`Room ${code} berhasil dibersihkan!`);
        });
      }
    }

    function dengarkanServer() {
      roomRef.on('value', (snapshot) => {
        gameState = snapshot.val();
        if (!gameState) return;

        renderLobbyStatus();
        renderBoard();
        renderHand();
        updateTurnDisplay();
        cekBotTurn();
      });
    }

    function renderLobbyStatus() {
      const pList = document.getElementById('player-list');
      const waitingBox = document.getElementById('lobby-waiting');
      const players = gameState.players || {};

      document.getElementById('player-count').innerText = Object.keys(players).length;
      pList.innerHTML = Object.values(players).map(p => `<span class="bg-emerald-950/80 px-2 py-0.5 rounded-lg border border-emerald-500/30 text-[10px] sm:text-xs">${p.name} ${p.isBot ? '🤖': ''}</span>`).join('');

      if (gameState.status === 'playing') {
        waitingBox.classList.add('hidden');
      } else {
        waitingBox.classList.remove('hidden');
        document.getElementById('btn-start').style.display = (gameState.host === myID) ? 'inline-block' : 'none';
      }
    }

    function mulaiGameDenganBot() {
      let deck = generateDeck();
      let players = gameState.players;
      let order = [...gameState.playerOrder];

      let botCount = 1;
      while (order.length < 4) {
        let botID = "bot_" + botCount;
        players[botID] = { name: "Bot " + botCount, hand: [], isBot: true };
        order.push(botID);
        botCount++;
      }

      order.forEach(pId => { players[pId].hand = deck.splice(0, 7); });

      roomRef.update({ players, playerOrder: order, status: "playing", board: [], leftVal: -1, rightVal: -1, currentTurnIdx: 0 });
    }

    function updateTurnDisplay() {
      if (gameState.status !== 'playing') return;
      const turnID = gameState.playerOrder[gameState.currentTurnIdx];
      const isMyTurn = (turnID === myID);
      const turnName = gameState.players[turnID] ? gameState.players[turnID].name : "Pemain";

      document.getElementById('disp-turn').innerText = isMyTurn ? "🎯 GILIRAN ANDA!" : `⏳ Giliran ${turnName}`;

      const passBtn = document.getElementById('btn-pass');
      if (isMyTurn && gameState.board.length > 0) {
        const myHand = gameState.players[myID].hand || [];
        const canPlay = myHand.some(c => c[0] === gameState.leftVal || c[1] === gameState.leftVal || c[0] === gameState.rightVal || c[1] === gameState.rightVal);
        passBtn.classList.toggle('hidden', canPlay);
      } else {
        passBtn.classList.add('hidden');
      }
    }

    function cekBotTurn() {
      if (gameState.status !== 'playing' || gameState.host !== myID) return;
      const turnID = gameState.playerOrder[gameState.currentTurnIdx];
      if (gameState.players[turnID]?.isBot) setTimeout(() => jalanBot(turnID), 1000);
    }

    function jalanBot(botID) {
      let botHand = gameState.players[botID].hand || [];
      let board = gameState.board || [];
      let left = gameState.leftVal, right = gameState.rightVal;

      if (board.length === 0) {
        let card = botHand.shift();
        board.push(card); left = card[0]; right = card[1];
      } else {
        let matchIdx = -1, isLeft = false, flip = false;
        for (let i = 0; i < botHand.length; i++) {
          let c = botHand[i];
          if (c[1] === left) { matchIdx = i; isLeft = true; flip = false; break; }
          if (c[0] === left) { matchIdx = i; isLeft = true; flip = true; break; }
          if (c[0] === right) { matchIdx = i; isLeft = false; flip = false; break; }
          if (c[1] === right) { matchIdx = i; isLeft = false; flip = true; break; }
        }

        if (matchIdx !== -1) {
          let c = botHand.splice(matchIdx, 1)[0];
          if (isLeft) { board.unshift(flip ? [c[1], c[0]] : c); left = flip ? c[1] : c[0]; }
          else { board.push(flip ? [c[1], c[0]] : c); right = flip ? c[0] : c[1]; }
        }
      }

      let nextTurn = (gameState.currentTurnIdx + 1) % gameState.playerOrder.length;
      roomRef.update({ board, leftVal: left, rightVal: right, [`players/${botID}/hand`]: botHand, currentTurnIdx: nextTurn });
    }

    function renderDotPattern(num) {
      let dots = '';
      const pos = { 0:[], 1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] };
      const active = pos[num] || [];
      for (let i = 0; i < 9; i++) dots += active.includes(i) ? `<div class="dot"></div>` : `<div></div>`;
      return `<div class="dot-grid">${dots}</div>`;
    }

    function createCardUI(card, isHoriz = false) {
      return `<div class="domino-card ${isHoriz ? 'horizontal' : ''}">${renderDotPattern(card[0])}<div class="${isHoriz ? 'domino-divider-h' : 'domino-divider-v'}"></div>${renderDotPattern(card[1])}</div>`;
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      if (!gameState.board || gameState.board.length === 0) {
        boardEl.innerHTML = '<div id="empty-board-msg" class="w-full text-center text-emerald-300/50 text-xs italic">Papan Kosong.</div>';
        return;
      }
      gameState.board.forEach(card => {
        const div = document.createElement('div');
        div.className = "flex-shrink-0";
        div.innerHTML = createCardUI(card, true);
        boardEl.appendChild(div);
      });
    }

    function renderHand() {
      const handEl = document.getElementById('hand');
      handEl.innerHTML = '';
      const myHand = gameState.players?.[myID]?.hand || [];
      document.getElementById('card-count').innerText = myHand.length;

      myHand.forEach((card, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = "flex-shrink-0";
        wrapper.innerHTML = createCardUI(card, false);
        wrapper.onclick = () => mainkanKartu(card, idx);
        handEl.appendChild(wrapper);
      });
    }

    function mainkanKartu(card, idx) {
      if (gameState.status !== 'playing') return;
      if (gameState.playerOrder[gameState.currentTurnIdx] !== myID) { alert("Bukan giliran Anda!"); return; }

      let board = gameState.board || [];
      let left = gameState.leftVal, right = gameState.rightVal;
      let newCard = [...card];

      if (board.length === 0) {
        board.push(newCard); left = newCard[0]; right = newCard[1];
      } else {
        if (newCard[1] === left) { board.unshift(newCard); left = newCard[0]; }
        else if (newCard[0] === left) { board.unshift([newCard[1], newCard[0]]); left = newCard[1]; }
        else if (newCard[0] === right) { board.push(newCard); right = newCard[1]; }
        else if (newCard[1] === right) { board.push([newCard[1], newCard[0]]); right = newCard[0]; }
        else { alert("Kartu tidak cocok!"); return; }
      }

      let myHand = gameState.players[myID].hand;
      myHand.splice(idx, 1);

      if (myHand.length === 0) alert("🎉 SELAMAT! ANDA MENANG!");

      let nextTurn = (gameState.currentTurnIdx + 1) % gameState.playerOrder.length;
      roomRef.update({ board, leftVal: left, rightVal: right, [`players/${myID}/hand`]: myHand, currentTurnIdx: nextTurn });
    }

    function passTurn() {
      let nextTurn = (gameState.currentTurnIdx + 1) % gameState.playerOrder.length;
      roomRef.update({ currentTurnIdx: nextTurn });
    }

    function keluarRoom() {
      if (roomRef) roomRef.off();
      document.getElementById('arena').classList.add('hidden');
      document.getElementById('lobby').classList.remove('hidden');
    }
  </script>
</body>
</html>
